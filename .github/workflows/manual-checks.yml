name: Manual offline checks

# Opt-in only: publishing or pushing this project does not execute it or its tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      LANGSMITH_TRACING: "false"
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Offline contract tests
        run: pytest
