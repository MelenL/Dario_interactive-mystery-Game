[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mystery-graph"
version = "0.1.0"
description = "A generative mystery game with Hugging Face inference, LangChain retrieval, and LangGraph orchestration."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Melen Laclais"}]
dependencies = [
  "langchain-core>=1.6.2,<2",
  "langchain-huggingface>=1.2.2,<2",
  "langgraph>=1.2.11,<2",
  "huggingface-hub>=1.30,<2",
  "sentence-transformers>=6.0.1,<7",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.1,<2",
  "gradio>=6.26,<7",
]

[project.optional-dependencies]
local = ["transformers>=5.16,<6", "accelerate>=1.0,<2"]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]

[project.scripts]
mystery-graph = "mystery_graph.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mystery_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
